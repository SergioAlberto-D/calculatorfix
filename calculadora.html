<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/calculadora.js" defer></script>
</head>
<body>
    <form action="#" method="post" id="Calculadora">
        <label for="numero1">Ingresa numero:</label>
        <input type="number" id="numero1" name="numero1"/>
        <br>
        <label for="numero2">Ingresa numero:</label>
        <input type="number" id="numero2" name="numero2"/>
        <br>
        <div class="align-content-center">
            <button type="button" id="btn_suma">+</button>
            <button type="button" id="btn_multiplica">*</button>
            <button type="button" id="btn_division">/</button>
            <button type="button" id="btn_Restar">-</button>
        </div>
        <br>
        <p id="resultado"></p>
    </form>
</body>
</html>
